<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ご予約ありがとうございます</title>
    <script
      src="https://kit.fontawesome.com/0f43db22f7.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Shippori+Mincho&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/complete.css" />
    <link rel="stylesheet" href="css/complete-responsive.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <p class="shop-name">IK COFFEE ROASTERS</p>
        <div class="icon-text-wrapper">
          <div class="date step">
            <div class="icon">
              <i class="fa-solid fa-check"></i>
            </div>
            <p>日時を選ぶ</p>
          </div>

          <div class="border"></div>

          <div class="name step">
            <div class="icon">
              <i class="fa-solid fa-check"></i>
            </div>
            <p>名前・連絡先を入力</p>
          </div>

          <div class="border"></div>

          <div class="email step">
            <div class="icon mail mail2">
              <i class="fa-regular fa-envelope"></i>
            </div>
            <p>確認メールが届く</p>
          </div>
        </div>
        <div class="message">
          <h2>ご予約ありがとうございます</h2>
          <p>個室のご予約を受け付けました</p>
          <p>
            ご入力のメールアドレスに確認メールをお送りしましたので、内容をご確認ください。
          </p>
          <p>当店のご来店を心よりお待ちしてます。</p>
        </div>
        <div class="return-top">
          <a href="index.html#roaster">トップページに戻る</a>
        </div>
      </div>
    </main>
  </body>
</html>
