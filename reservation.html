<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個室の予約フォーム</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Zen+Old+Mincho&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/form.css" />
  </head>

  <body>
    <div class="return-top">
      <a href="index.html#pricing">←トップページに戻る</a>
    </div>
    <main>
      <div class="form-wrapper">
        <div class="form-title">
          <h1>ご予約情報の入力</h1>
          <p class="description">
            以下の項目をご入力のうえ、送信してください。すべての項目が入力必須です。
          </p>
          <p class="description">
            ※仮のページになります。実際に送信はできません。
          </p>
        </div>
        <form>
          <h2>ご希望日時</h2>
          <div class="form-group">
            <label for="date">日付</label>
            <input
              id="date"
              class="form-input date-input"
              type="date"
              required
            />
          </div>
          <div class="time-wrapper">
            <div class="form-group">
              <label for="start-time">開始時間</label>
              <input
                id="start-time"
                class="form-input time-input"
                type="time"
                required
              />
            </div>
            <span>～</span>
            <div class="form-group">
              <label for="end-time">終了時間</label>
              <input
                id="end-time"
                class="form-input time-input"
                type="time"
                required
              />
            </div>
          </div>
          <h2>お客様情報</h2>
          <div class="name-wrapper">
            <div class="form-group">
              <label for="last-name">名字</label>
              <input
                id="last-name"
                class="form-input name-input"
                placeholder="例）山田"
                type="text"
                required
              />
            </div>
            <div class="form-group">
              <label for="first-name">名前</label>
              <input
                id="first-name"
                class="form-input name-input"
                placeholder="例）太郎"
                type="text"
                required
              />
            </div>
          </div>

          <div class="form-group tel-group">
            <label for="tel"
              >電話番号 <br /><span class="description"
                >ハイフンあり·なし、どちらでも入力できます</span
              ></label
            >
            <input
              id="tel"
              class="form-input tel-input"
              placeholder="例）090-1234-5678"
              type="tel"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input
              id="email"
              class="form-input email-input"
              placeholder="例）sample@example.com"
              type="email"
              required
            />
          </div>
          <button class="submit-button" type="submit">送信する</button>
        </form>
      </div>
    </main>
  </body>
</html>
