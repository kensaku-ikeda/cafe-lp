<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ランダムにコーヒー豆を決めるサイト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&family=Zen+Old+Mincho&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/shuffle.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="return-top">
          <a href="index.html#roaster">トップページに戻る</a>
        </div>
        <div class="shuffle-header">
          <h1>コーヒー豆占い</h1>
        </div>
        <div class="shuffle-wrapper">
          <div class="shuffle-main">
            <img
              class="beans-image"
              src="images/coffee-pack-images/bluemountain.jpg"
              alt="コーヒー豆の画像"
            />
            <button class="btn shuffle-btn">シャッフルする</button>
          </div>
          <div class="shuffle-list">
            <ul>
              <li>ブラジル</li>
              <li>コロンビア</li>
              <li>エチオピア</li>
              <li>ペルー</li>
              <li>ブルーマウンテン</li>
              <li>グアテマラ</li>
            </ul>
          </div>
        </div>
      </div>
    </main>
    <script src="js/script.js" defer></script>
  </body>
</html>
