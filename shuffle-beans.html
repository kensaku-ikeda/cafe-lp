<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ランダムにコーヒー豆を決めるサイト</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Maru+Gothic&family=Zen+Old+Mincho&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/shuffle.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="return-top">
          <a href="index.html#roaster">◀トップページに戻る</a>
        </div>
        <div class="shuffle-header">
          <h1>コーヒー豆占い</h1>
        </div>
        <div class="shuffle-wrapper">
          <div class="shuffle-main">
            <img
              class="beans-image"
              src="images/coffee-pack-images/bluemountain.jpg"
              alt="コーヒー豆の画像"
            />
            <button class="btn shuffle-btn">シャッフルする</button>
            <div class="shuffle-list">
              <h2>候補の豆</h2>
              <ul>
                <li><span class="fi fi-br"></span>ブラジル</li>
                <li><span class="fi fi-co"></span>コロンビア</li>
                <li><span class="fi fi-et"></span>エチオピア</li>
                <li><span class="fi fi-pe"></span>ペルー</li>
                <li><span class="fi fi-jm"></span>ブルーマウンテン</li>
                <li><span class="fi fi-gt"></span>グアテマラ</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2/dist/confetti.browser.min.js"></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
